<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Preview — LocalEyes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
  }

  .phone-frame {
    width: 375px;
    height: 812px;
    background: #000;
    border-radius: 54px;
    padding: 18px;
    box-shadow:
      0 0 0 3px #333,
      0 0 0 6px #222,
      0 30px 80px rgba(0,0,0,0.7),
      inset 0 0 0 2px #2a2a2a;
    position: relative;
  }

  /* notch */
  .phone-frame::before {
    content: '';
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 10;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 36px;
    background: #fff;
    display: block;
  }

  .controls {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    background: #222;
    padding: 12px 20px;
    border-radius: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .controls a {
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 20px;
    background: #333;
    transition: background 0.2s;
  }
  .controls a:hover { background: #444; }
  .controls a.primary { background: #3b82f6; }
  .controls a.primary:hover { background: #2563eb; }
  .controls span {
    color: #888;
    font-size: 12px;
  }

  .label {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #666;
    font-size: 13px;
    background: #222;
    padding: 6px 16px;
    border-radius: 20px;
  }
</style>
</head>
<body>

<div class="label">iPhone 12/13/14/15 — 390×844</div>

<div class="phone-frame">
  <iframe class="phone-screen" src="http://localhost:8080" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>

<div class="controls">
  <a href="http://localhost:8080" target="_blank">Open in Browser</a>
  <span>|</span>
  <a href="http://localhost:8080/services/ugc-content.html" target="_blank">Content Page</a>
  <a href="http://localhost:8080/index.html" target="_blank">Home</a>
</div>

</body>
</html>
